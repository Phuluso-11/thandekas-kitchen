<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Thandeka's Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">Thandeka's Kitchen</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Request a Quote</h1>
        <p>Tell us about your order or event, and we'll get back to you within 24 hours.</p>

        
        <form id="enquiry-form" action="#" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="event-type">Type of Enquiry</label>
            <select id="event-type" name="event-type">
                <option value="cake">Custom Cake</option>
                <option value="catering">Corporate Catering</option>
                <option value="pastries">Pastry Order</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Details</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Submit Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Thandeka's Kitchen. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
