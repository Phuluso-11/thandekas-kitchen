<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photographs of cakes, pastries and catering setups baked and styled by Thandeka's Kitchen in Johannesburg.">
    <title>Gallery | Thandeka's Kitchen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="index.html">Thandeka's Kitchen</a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label class="nav-toggle-label" for="nav-toggle" aria-label="Open and close the navigation menu"><span></span></label>
            <nav class="site-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="gallery.html" class="active" aria-current="page">Gallery</a></li>
                    <li><a href="enquiry.html">Enquiry</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <h1>Our Gallery</h1>
        <p>A look at some of our favourite bakes and past catering events.</p>

        <!-- Photo grid. Column count is handled by CSS Grid in style.css.
             Each image offers two file sizes; the browser picks one using the
             sizes attribute, so phones never download the desktop file. -->
        <section class="gallery-grid">
            <img src="images/gallery/cake-1.jpg"
                 srcset="images/gallery/cake-1-800.jpg 800w, images/gallery/cake-1.jpg 1600w"
                 sizes="(max-width: 640px) 100vw, (max-width: 900px) 50vw, 33vw"
                 alt="Custom two-tier celebration cake with floral decoration" loading="lazy">

            <img src="images/gallery/pastries-1.jpg"
                 srcset="images/gallery/pastries-1-800.jpg 800w, images/gallery/pastries-1.jpg 1600w"
                 sizes="(max-width: 640px) 100vw, (max-width: 900px) 50vw, 33vw"
                 alt="Assorted fresh pastries and croissants on display" loading="lazy">

            <img src="images/gallery/catering-1.jpg"
                 srcset="images/gallery/catering-1-800.jpg 800w, images/gallery/catering-1.jpg 1600w"
                 sizes="(max-width: 640px) 100vw, (max-width: 900px) 50vw, 33vw"
                 alt="Corporate catering table setup with pastry platters" loading="lazy">

            <img src="images/gallery/cake-2.jpg"
                 srcset="images/gallery/cake-2-800.jpg 800w, images/gallery/cake-2.jpg 1600w"
                 sizes="(max-width: 640px) 100vw, (max-width: 900px) 50vw, 33vw"
                 alt="Chocolate birthday cake with custom decoration" loading="lazy">

            <img src="images/gallery/bread-1.jpg"
                 srcset="images/gallery/bread-1-800.jpg 800w, images/gallery/bread-1.jpg 1600w"
                 sizes="(max-width: 640px) 100vw, (max-width: 900px) 50vw, 33vw"
                 alt="Fresh artisan bread loaves cooling on a rack" loading="lazy">

            <img src="images/gallery/event-1.jpg"
                 srcset="images/gallery/event-1-800.jpg 800w, images/gallery/event-1.jpg 1600w"
                 sizes="(max-width: 640px) 100vw, (max-width: 900px) 50vw, 33vw"
                 alt="Dessert table set up for a wedding event" loading="lazy">
        </section>

        <a href="enquiry.html" class="cta-button">Enquire About an Order</a>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Thandeka's Kitchen. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
